name: Deploy Checkout Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      # The Worker bundles the in-repo catalog for prices, names and VAT rates, so catalog edits must redeploy it.
      - 'src/data/products.ts'
      - 'src/data/products.json'
      - 'src/data/productTypes.ts'
      - 'src/data/shippingMethods.live.ts'
      - 'src/data/shippingMethods.sandbox.ts'
      - 'src/data/shippingMethodTypes.ts'
      - 'src/lib/productVariants.ts'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: node ../scripts/check-catalog.mjs
      - name: Sync Stripe secret
        run: printf '%s' "$STRIPE_SECRET_KEY" | npx wrangler secret put STRIPE_SECRET_KEY --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      - name: Deploy
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

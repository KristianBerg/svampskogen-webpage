<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Svampskogen CMS</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 1440px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.3rem; }
  h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: 0.05em; color: #666; margin-top: 2rem; }
  /* Fixed columns so the controls line up across rows whatever the name or
     status length; long text wraps inside its own column. */
  .product { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr) 6.5rem 9rem 7.5rem 5rem 7rem 5.5rem 8rem auto auto auto auto; align-items: center; gap: 0.75rem; padding: 0.5rem 0; border-bottom: 1px solid #eee; }
  .product-name { overflow-wrap: anywhere; }
  .product-published { display: flex; align-items: center; gap: 0.3rem; font-size: 0.8rem; color: #666; cursor: pointer; }
  .product.unpublished .product-name { color: #999; font-style: italic; }
  .product-count { color: #888; font-size: 0.85rem; }
  .product-status { font-size: 0.85rem; color: #888; overflow-wrap: anywhere; }
  .product-category { font: inherit; font-size: 0.85rem; width: 100%; box-sizing: border-box; padding: 0.2rem 0.4rem; }
  .product-price { display: flex; align-items: center; gap: 0.3rem; font-size: 0.85rem; color: #666; }
  .product-price input { font: inherit; width: 100%; min-width: 0; box-sizing: border-box; padding: 0.2rem 0.4rem; }
  .product-vat { font: inherit; font-size: 0.85rem; width: 100%; padding: 0.2rem 0.4rem; }
  button { font: inherit; padding: 0.3rem 0.75rem; cursor: pointer; }
  input[type="file"] { display: none; }
  dialog { width: min(640px, calc(100vw - 2rem)); border: 1px solid #ccc; border-radius: 6px; padding: 1.25rem; }
  dialog::backdrop { background: rgba(0, 0, 0, 0.35); }
  dialog h3 { margin: 0 0 1rem; font-size: 1.1rem; }
  dialog fieldset { border: 1px solid #ddd; border-radius: 4px; margin: 0 0 1rem; padding: 0.75rem; }
  dialog legend { font-weight: 600; font-size: 0.9rem; }
  dialog label { display: block; font-size: 0.85rem; color: #555; margin-bottom: 0.75rem; }
  dialog input, dialog textarea { display: block; box-sizing: border-box; width: 100%; margin-top: 0.25rem; font: inherit; padding: 0.35rem 0.5rem; }
  dialog textarea { min-height: 7rem; resize: vertical; }
  .dialog-actions { display: flex; align-items: center; justify-content: flex-end; gap: 0.5rem; }
  .dialog-status { flex: 1; font-size: 0.85rem; color: #b00; }
  .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 0.75rem; margin-bottom: 1rem; }
  .photo { border: 1px solid #ddd; border-radius: 4px; padding: 0.4rem; background: #fff; cursor: grab; }
  .photo.dragging { opacity: 0.4; }
  .photo img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: #f3f3f3; pointer-events: none; }
  .photo-meta { font-size: 0.8rem; color: #666; margin: 0.3rem 0; }
  .photo-actions { display: flex; gap: 0.25rem; }
  .photo-actions button { padding: 0.15rem 0.4rem; font-size: 0.8rem; }
  .photo-actions .photo-delete { margin-left: auto; color: #b00; }
  .photo-empty { color: #888; font-size: 0.9rem; }
  .commit-bar { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; border: 1px solid #ddd; border-radius: 4px; background: #fafafa; }
  .commit-message { flex: 1; min-width: 0; font: inherit; font-size: 0.85rem; padding: 0.25rem 0.5rem; }
  .commit-status { font-size: 0.85rem; color: #666; overflow-wrap: anywhere; }
  .commit-status.error { color: #b00; }
  .commit-files { margin: 0 0 1rem; padding: 0.5rem 0.75rem; max-height: 50vh; overflow-y: auto; list-style: none; border: 1px solid #ddd; border-radius: 4px; font-family: monospace; font-size: 0.8rem; overflow-wrap: anywhere; }
  .tab-actions { display: flex; justify-content: flex-end; margin-top: 0.75rem; }
  dialog select { display: block; width: 100%; margin-top: 0.25rem; font: inherit; padding: 0.35rem 0.5rem; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem; }
  .field-hint { display: block; font-size: 0.8rem; color: #888; margin-top: 0.2rem; }
  .variant-names { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .variant-options-heading { font-size: 0.85rem; color: #555; margin: 0 0 0.25rem; }
  .variant-row { display: grid; grid-template-columns: 1fr 1fr auto auto auto; align-items: center; gap: 0.35rem; margin-bottom: 0.35rem; }
  .variant-row input { margin-top: 0; }
  .variant-row button, .variant-category-actions button { padding: 0.15rem 0.4rem; font-size: 0.8rem; }
  .variant-category-actions { display: flex; gap: 0.25rem; justify-content: flex-end; margin-top: 0.5rem; }
  .variant-delete { color: #b00; }
  .variant-add-category { margin-bottom: 1rem; }
  .page-tabs { display: flex; gap: 0.25rem; margin-top: 1rem; border-bottom: 1px solid #ddd; }
  .page-tabs button { border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 0.5rem 1rem; background: none; color: #666; }
  .page-tabs button[aria-selected="true"] { border-bottom-color: #222; color: #222; font-weight: 600; }
  /* Fixed button columns so the header row, which has no buttons, lines up. */
  .category-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 6rem minmax(0, 1fr) 2.5rem 2.5rem 4rem 5.5rem; align-items: center; gap: 0.75rem; padding: 0.5rem 0; border-bottom: 1px solid #eee; }
  .category-row span { overflow-wrap: anywhere; }
  .category-header { color: #666; font-size: 0.85rem; }
</style>
</head>
<body>
<h1>Svampskogen CMS</h1>
<div class="commit-bar">
  <span class="commit-status" id="commit-status"></span>
  <input class="commit-message" id="commit-message" placeholder="Commit message (optional)" />
  <button type="button" id="commit-button" disabled>Commit changes</button>
</div>
<div class="page-tabs" role="tablist">
  <button type="button" role="tab" data-tab="products">Products</button>
  <button type="button" role="tab" data-tab="categories">Categories</button>
</div>
<div id="products-tab">
  <div class="tab-actions"><button type="button" id="new-product-button">New product</button></div>
  <div id="app">Loading products…</div>
</div>
<div id="categories-tab" hidden>
  <div class="tab-actions"><button type="button" id="new-category-button">New category</button></div>
  <div id="category-list"></div>
</div>

<dialog id="category-dialog">
  <form id="category-form" method="dialog">
    <h3 id="category-title">New category</h3>
    <label>Svenska <input name="name-sv" required maxlength="60" /></label>
    <label>English <input name="name-en" required maxlength="60" /></label>
    <div class="dialog-actions">
      <span class="dialog-status" id="category-status"></span>
      <button type="button" id="category-cancel">Cancel</button>
      <button type="submit" id="category-save">Save</button>
    </div>
  </form>
</dialog>

<dialog id="copy-dialog">
  <form id="copy-form" method="dialog">
    <h3 id="copy-title">Edit copy</h3>
    <fieldset>
      <legend>Svenska</legend>
      <label>Name <input name="name-sv" required maxlength="120" /></label>
      <label>Description <textarea name="description-sv"></textarea></label>
    </fieldset>
    <fieldset>
      <legend>English</legend>
      <label>Name <input name="name-en" required maxlength="120" /></label>
      <label>Description <textarea name="description-en"></textarea></label>
    </fieldset>
    <div class="dialog-actions">
      <span class="dialog-status" id="copy-status"></span>
      <button type="button" id="copy-cancel">Cancel</button>
      <button type="submit" id="copy-save">Save</button>
    </div>
  </form>
</dialog>

<dialog id="variants-dialog">
  <form id="variants-form" method="dialog">
    <h3 id="variants-title">Variants</h3>
    <div id="variant-categories"></div>
    <button type="button" class="variant-add-category" id="variant-add-category">Add category</button>
    <div class="dialog-actions">
      <span class="dialog-status" id="variants-status"></span>
      <button type="button" id="variants-cancel">Cancel</button>
      <button type="submit" id="variants-save">Save</button>
    </div>
  </form>
</dialog>

<dialog id="new-product-dialog">
  <form id="new-product-form" method="dialog">
    <h3>New product</h3>
    <fieldset>
      <legend>Name</legend>
      <label>Svenska <input name="name-sv" required maxlength="120" /></label>
      <label>English <input name="name-en" required maxlength="120" /></label>
      <label>Slug
        <input name="slug" required maxlength="60" pattern="[a-z0-9]+(-[a-z0-9]+)*" />
        <span class="field-hint">Used in the product URL and photo folders, can't be changed later in the CMS</span>
      </label>
    </fieldset>
    <div class="field-row">
      <label>Price (kr) <input name="price" type="number" required min="1" max="99999" step="1" /></label>
      <label>VAT <select name="vat"></select></label>
      <label>Category <select name="category"></select></label>
    </div>
    <div class="dialog-actions">
      <span class="dialog-status" id="new-product-status"></span>
      <button type="button" id="new-product-cancel">Cancel</button>
      <button type="submit" id="new-product-save">Create unpublished</button>
    </div>
  </form>
</dialog>

<dialog id="photos-dialog">
  <form id="photos-form" method="dialog">
    <h3 id="photos-title">Photos</h3>
    <div class="photo-grid" id="photo-grid"></div>
    <div class="dialog-actions">
      <span class="dialog-status" id="photos-status"></span>
      <button type="button" id="photos-cancel">Cancel</button>
      <button type="submit" id="photos-save">Save</button>
    </div>
  </form>
</dialog>

<dialog id="commit-dialog">
  <form id="commit-form" method="dialog">
    <h3 id="commit-title">Commit</h3>
    <ul class="commit-files" id="commit-files"></ul>
    <div class="dialog-actions">
      <button type="button" id="commit-cancel">Cancel</button>
      <button type="submit" id="commit-confirm">Commit</button>
    </div>
  </form>
</dialog>

<script>
async function loadProducts() {
  const res = await fetch('/api/products')
  return res.json()
}

// The store categories as of the last render.
let categories = []

async function loadCategories() {
  const res = await fetch('/api/categories')
  return res.json()
}

async function sendCategoryRequest(method, path, body) {
  const res = await fetch(`/api/categories${path}`, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  })
  if (!res.ok) {
    const responseBody = await res.json().catch(() => ({}))
    throw new Error(responseBody.error ?? `Saving category failed (${res.status})`)
  }
}

// In category order, with uncategorized products last.
function groupByCategory(products) {
  const groups = categories.map((category) => [category.name.sv, products.filter((product) => product.category === category.id)])
  const knownIds = new Set(categories.map((category) => category.id))
  groups.push(['Uncategorized', products.filter((product) => !knownIds.has(product.category))])
  return groups.filter(([, items]) => items.length > 0)
}

function fillCategorySelect(select) {
  select.replaceChildren(
    new Option('No category', ''),
    ...categories.map((category) => new Option(category.name.sv, category.id)),
  )
}

async function savePublished(slug, published) {
  const res = await fetch(`/api/products/${encodeURIComponent(slug)}/published`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ published }),
  })
  if (!res.ok) {
    const body = await res.json().catch(() => ({}))
    throw new Error(body.error ?? `Saving published state failed (${res.status})`)
  }
}

async function saveCopy(slug, copy) {
  const res = await fetch(`/api/products/${encodeURIComponent(slug)}/copy`, {

  })
  if (!res.ok) {
    const body = await res.json().catch(() => ({}))
    throw new Error(body.error ?? `Saving variants failed (${res.status})`)

const VAT_RATES = [0.25, 0.12, 0.06]

function appendVatOptions(select) {
  for (const rate of VAT_RATES) {
    const option = document.createElement('option')
    option.value = String(rate)
    option.textContent = `${Math.round(rate * 100)}% moms`
    select.appendChild(option)
  }
}

async function createProduct(product) {
  const res = await fetch('/api/products', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(product),
  })
  if (!res.ok) {
    const body = await res.json().catch(() => ({}))
    throw new Error(body.error ?? `Creating product failed (${res.status})`)
  }
}

// "Svampkniv Ek & Läder" -> "svampkniv-ek-lader". Diacritics are stripped
// (å/ä -> a, ö -> o) since the slug ends up in URLs and folder names.
function slugify(text) {
  return text
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 60)
    .replace(/-+$/, '')
}

function setupNewProductDialog() {
  const dialog = document.getElementById('new-product-dialog')
  const form = document.getElementById('new-product-form')
  const status = document.getElementById('new-product-status')
  const save = document.getElementById('new-product-save')
  const { slug, vat } = form.elements
  appendVatOptions(vat)

  // The slug follows the Swedish name until it's edited by hand.
  let slugEdited = false
  form.elements['name-sv'].oninput = () => {
    if (!slugEdited) slug.value = slugify(form.elements['name-sv'].value)
  }
  slug.oninput = () => { slugEdited = slug.value !== '' }

  document.getElementById('new-product-button').onclick = () => {
    fillCategorySelect(form.elements.category)
    form.reset()
    vat.value = '0.25'
    slugEdited = false
    status.textContent = ''
    dialog.showModal()
  }
  document.getElementById('new-product-cancel').onclick = () => dialog.close()

  form.onsubmit = (event) => {
    event.preventDefault()
    const product = {
      slug: slug.value,
      priceKr: Number(form.elements.price.value),
      vatRate: Number(vat.value),
      category: form.elements.category.value,
      name: { sv: form.elements['name-sv'].value, en: form.elements['name-en'].value },
    }
    save.disabled = true
    status.textContent = ''
    createProduct(product)
      .then(() => { dialog.close(); return render() })
      .catch((error) => { status.textContent = `Error: ${error.message}` })
      .finally(() => { save.disabled = false })
  }
}

// One shared dialog; openCopyDialog points it at whichever product's
// "Edit copy" button was clicked.
let copyDialogSlug = null

function openCopyDialog(product) {
  const dialog = document.getElementById('copy-dialog')
  const form = document.getElementById('copy-form')
  copyDialogSlug = product.slug
  document.getElementById('copy-title').textContent = `Edit copy: ${product.name}`
  document.getElementById('copy-status').textContent = ''
  form.elements['name-sv'].value = product.copy.name.sv
  form.elements['name-en'].value = product.copy.name.en
  form.elements['description-sv'].value = product.copy.description.sv
  form.elements['description-en'].value = product.copy.description.en
  dialog.showModal()
}

function setupCopyDialog() {
  const dialog = document.getElementById('copy-dialog')
  const form = document.getElementById('copy-form')
  const status = document.getElementById('copy-status')
  const save = document.getElementById('copy-save')

  document.getElementById('copy-cancel').onclick = () => dialog.close()

  form.onsubmit = (event) => {
    event.preventDefault()
    const copy = {
      name: { sv: form.elements['name-sv'].value, en: form.elements['name-en'].value },
      description: { sv: form.elements['description-sv'].value, en: form.elements['description-en'].value },
    }
    save.disabled = true
    status.textContent = ''
    saveCopy(copyDialogSlug, copy)
      .then(() => { dialog.close(); return render() })
      .catch((error) => { status.textContent = `Error: ${error.message}` })
      .finally(() => { save.disabled = false })
  }
}

// Like the copy dialog, one shared dialog. variantsDialogCategories is a
// working copy that's only sent to the server on Save.
let variantsDialogSlug = null
let variantsDialogCategories = []

function openVariantsDialog(product) {
  variantsDialogSlug = product.slug
  variantsDialogCategories = structuredClone(product.variants)
  document.getElementById('variants-title').textContent = `Variants: ${product.name}`
  document.getElementById('variants-status').textContent = ''
  renderVariantCategories()
  document.getElementById('variants-dialog').showModal()
}

function moveVariantEntry(list, from, to) {
  if (to < 0 || to >= list.length) return
  list.splice(to, 0, list.splice(from, 1)[0])
  renderVariantCategories()
}

function emptyVariantOption() {
  return { name: { sv: '', en: '' } }
}

function variantButton(text, title, onclick, disabled = false) {
  const button = document.createElement('button')
  button.type = 'button'
  button.textContent = text
  button.title = title
  button.disabled = disabled
  button.onclick = onclick
  return button
}

// Typing goes straight into the working copy, so re-rendering after adding,
// moving or removing a row never loses anything.
function variantNameInput(entry, lang, placeholder, focusEntry) {
  const input = document.createElement('input')
  input.required = true
  input.maxLength = 60
  input.placeholder = placeholder
  input.value = entry.name[lang]
  input.oninput = () => { entry.name[lang] = input.value }
  if (entry === focusEntry && lang === 'sv') queueMicrotask(() => input.focus())
  return input
}

function renderVariantOption(category, option, position, focusEntry) {
  const row = document.createElement('div')
  row.className = 'variant-row'
  const remove = variantButton('Remove', 'Remove this option', () => {
    category.options.splice(position, 1)
    renderVariantCategories()
  }, category.options.length === 1)
  remove.classList.add('variant-delete')
  row.append(
    variantNameInput(option, 'sv', 'Svenska', focusEntry),
    variantNameInput(option, 'en', 'English', focusEntry),
    variantButton('↑', 'Move up', () => moveVariantEntry(category.options, position, position - 1), position === 0),
    variantButton('↓', 'Move down', () => moveVariantEntry(category.options, position, position + 1), position === category.options.length - 1),
    remove,
  )
  return row
}

function renderVariantCategory(category, position, focusEntry) {
  const categories = variantsDialogCategories
  const fieldset = document.createElement('fieldset')
  const legend = document.createElement('legend')
  legend.textContent = `Category ${position + 1}`

  const names = document.createElement('div')
  names.className = 'variant-names'
  for (const [lang, text] of [['sv', 'Name, svenska'], ['en', 'Name, English']]) {
    const label = document.createElement('label')
    label.append(text, variantNameInput(category, lang, lang === 'sv' ? 'Färg' : 'Color', focusEntry))
    names.appendChild(label)
  }

  const heading = document.createElement('p')
  heading.className = 'variant-options-heading'
  heading.textContent = 'Options'

  const addOption = variantButton('Add option', 'Add an option to this category', () => {
    const option = emptyVariantOption()
    category.options.push(option)
    renderVariantCategories(option)
  })

  const remove = variantButton('Remove category', 'Remove this category and its options', () => {
    categories.splice(position, 1)
    renderVariantCategories()
  })
  remove.classList.add('variant-delete')

  const actions = document.createElement('div')
  actions.className = 'variant-category-actions'
  actions.append(
    addOption,
    variantButton('↑', 'Move category up (sets the order in the line item title)', () => moveVariantEntry(categories, position, position - 1), position === 0),
    variantButton('↓', 'Move category down (sets the order in the line item title)', () => moveVariantEntry(categories, position, position + 1), position === categories.length - 1),
    remove,
  )

  fieldset.append(
    legend,
    names,
    heading,
    ...category.options.map((option, index) => renderVariantOption(category, option, index, focusEntry)),
    actions,
  )
  return fieldset
}

function renderVariantCategories(focusEntry = null) {
  const container = document.getElementById('variant-categories')
  container.innerHTML = ''
  if (variantsDialogCategories.length === 0) {
    const empty = document.createElement('p')
    empty.className = 'photo-empty'
    empty.textContent = 'No variant categories. The product is sold as it is.'
    container.appendChild(empty)
    return
  }
  variantsDialogCategories.forEach((category, position) => {
    container.appendChild(renderVariantCategory(category, position, focusEntry))
  })
}

// New entries get an id from their Swedish name. Existing ones keep theirs,
// so renaming an option doesn't invalidate carts or past orders that use it.
function assignVariantIds(entries, fallback) {
  const taken = new Set(entries.map((entry) => entry.id).filter(Boolean))
  for (const entry of entries) {
    if (entry.id) continue
    const base = slugify(entry.name.sv) || fallback
    let id = base
    for (let n = 2; taken.has(id); n++) id = `${base}-${n}`
    taken.add(id)
    entry.id = id
  }
}

function setupVariantsDialog() {
  const dialog = document.getElementById('variants-dialog')
  const form = document.getElementById('variants-form')
  const status = document.getElementById('variants-status')
  const save = document.getElementById('variants-save')

  document.getElementById('variants-cancel').onclick = () => dialog.close()
  document.getElementById('variant-add-category').onclick = () => {
    const category = { name: { sv: '', en: '' }, options: [emptyVariantOption()] }
    variantsDialogCategories.push(category)
    renderVariantCategories(category)
  }

  form.onsubmit = (event) => {
    event.preventDefault()
    assignVariantIds(variantsDialogCategories, 'kategori')
    for (const category of variantsDialogCategories) assignVariantIds(category.options, 'alternativ')
    save.disabled = true
    status.textContent = ''
    saveVariants(variantsDialogSlug, variantsDialogCategories)
      .then(() => { dialog.close(); return render() })
      .catch((error) => { status.textContent = `Error: ${error.message}` })
      .finally(() => { save.disabled = false })
  }
}

async function loadPhotos(slug) {
  const res = await fetch(`/api/products/${encodeURIComponent(slug)}/photos`)
  if (!res.ok) throw new Error(`Loading photos failed (${res.status})`)
  return res.json()
}

async function savePhotoOrder(slug, order) {
  const res = await fetch(`/api/products/${encodeURIComponent(slug)}/photos`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ order }),
  })
  if (!res.ok) {
    const body = await res.json().catch(() => ({}))
    throw new Error(body.error ?? `Saving photos failed (${res.status})`)
  }
}

async function runProcess() {
  const res = await fetch('/api/process', { method: 'POST' })
  const body = await res.json()
  if (!res.ok) throw new Error(`Processing failed: ${body.output ?? res.status}`)
}

// Like the copy dialog, one shared dialog. photosDialogOrder holds the
// photos' original numbers in their pending order; it's only sent to the
// server on Save.
let photosDialogSlug = null
let photosDialogOrder = []
let photosDialogTotal = 0

async function openPhotosDialog(product) {
  const dialog = document.getElementById('photos-dialog')
  photosDialogSlug = product.slug
  document.getElementById('photos-title').textContent = `Photos: ${product.name}`
  document.getElementById('photos-status').textContent = ''
  const photos = await loadPhotos(product.slug)
  photosDialogOrder = photos.map((photo) => photo.n)
  photosDialogTotal = photos.length
  renderPhotoGrid()
  dialog.showModal()
}

function movePhoto(from, to) {
  if (to < 0 || to >= photosDialogOrder.length) return
  const [n] = photosDialogOrder.splice(from, 1)
  photosDialogOrder.splice(to, 0, n)
  renderPhotoGrid()
}

function renderPhotoGrid() {
  const grid = document.getElementById('photo-grid')
  grid.innerHTML = ''
  if (photosDialogOrder.length === 0) {
    const empty = document.createElement('p')
    empty.className = 'photo-empty'
    empty.textContent = 'No photos left. Saving will remove them all.'
    grid.appendChild(empty)
    return
  }

  // Changes on every open, so a thumbnail renamed by an earlier save isn't
  // served from the browser cache under its old number.
  const cacheKey = Date.now()

  for (const [position, n] of photosDialogOrder.entries()) {
    const card = document.createElement('div')
    card.className = 'photo'
    card.draggable = true
    card.ondragstart = (event) => {
      event.dataTransfer.setData('text/plain', String(position))
      card.classList.add('dragging')
    }
    card.ondragend = () => card.classList.remove('dragging')
    card.ondragover = (event) => event.preventDefault()
    card.ondrop = (event) => {
      event.preventDefault()
      movePhoto(Number(event.dataTransfer.getData('text/plain')), position)
    }

    const img = document.createElement('img')
    img.src = `/api/products/${encodeURIComponent(photosDialogSlug)}/photos/${n}/thumb?v=${cacheKey}`
    img.alt = `Photo ${n}`

    const meta = document.createElement('div')
    meta.className = 'photo-meta'
    meta.textContent = position === 0 ? `${position + 1} (main)` : String(position + 1)

    const actions = document.createElement('div')
    actions.className = 'photo-actions'

    const left = document.createElement('button')
    left.type = 'button'
    left.textContent = '←'
    left.title = 'Move earlier'
    left.disabled = position === 0
    left.onclick = () => movePhoto(position, position - 1)

    const right = document.createElement('button')
    right.type = 'button'
    right.textContent = '→'
    right.title = 'Move later'
    right.disabled = position === photosDialogOrder.length - 1
    right.onclick = () => movePhoto(position, position + 1)

    const remove = document.createElement('button')
    remove.type = 'button'
    remove.className = 'photo-delete'
    remove.textContent = 'Delete'
    remove.onclick = () => {
      photosDialogOrder.splice(position, 1)
      renderPhotoGrid()
    }

    actions.append(left, right, remove)
    card.append(img, meta, actions)
    grid.appendChild(card)
  }
}

function setupPhotosDialog() {
  const dialog = document.getElementById('photos-dialog')
  const form = document.getElementById('photos-form')
  const status = document.getElementById('photos-status')
  const save = document.getElementById('photos-save')

  document.getElementById('photos-cancel').onclick = () => dialog.close()

  form.onsubmit = (event) => {
    event.preventDefault()
    const deleted = photosDialogTotal - photosDialogOrder.length
    if (deleted > 0 && !confirm(`Delete ${deleted} photo${deleted === 1 ? '' : 's'}?`)) return
    save.disabled = true
    status.textContent = 'Saving…'
    savePhotoOrder(photosDialogSlug, photosDialogOrder)
      .then(() => { status.textContent = 'Processing…'; return runProcess() })
      .then(() => { dialog.close(); return render() })
      .catch((error) => { status.textContent = `Error: ${error.message}` })
      .finally(() => { save.disabled = false })
  }
}

async function uploadFiles(slug, files, statusEl) {
  for (let i = 0; i < files.length; i++) {
    statusEl.textContent = `Uploading ${i + 1}/${files.length}…`
    const res = await fetch(`/api/products/${encodeURIComponent(slug)}/upload`, {
      method: 'POST',
      headers: { 'X-Filename': files[i].name },
      body: files[i],
    })
    if (!res.ok) {
      const body = await res.json().catch(() => ({}))
      throw new Error(body.error ?? `Upload failed (${res.status})`)
    }
  }

  statusEl.textContent = 'Processing…'
  await runProcess()
  refreshCommitBar()

  statusEl.textContent = `Done — uploaded ${files.length} photo(s).`
}

function renderProductRow(product) {
  const row = document.createElement('div')
  row.className = product.published ? 'product' : 'product unpublished'

  const name = document.createElement('span')
  name.className = 'product-name'
  name.textContent = product.name

  const count = document.createElement('span')
  count.className = 'product-count'
  count.textContent = `${product.imageCount} photo${product.imageCount === 1 ? '' : 's'}`

  const variantCount = document.createElement('span')
  variantCount.className = 'product-count'
  variantCount.textContent = `${product.variants.length} variant categor${product.variants.length === 1 ? 'y' : 'ies'}`

  const status = document.createElement('span')
  status.className = 'product-status'

  const publishedWrap = document.createElement('label')
  publishedWrap.className = 'product-published'
  publishedWrap.title = 'Unpublished products stay here but are hidden from the store and cannot be bought'
  const published = document.createElement('input')
  published.type = 'checkbox'
  published.checked = product.published
  published.onchange = () => {
    published.disabled = true
    status.textContent = 'Saving…'
    savePublished(product.slug, published.checked)
      .then(() => render())
      .catch((error) => {
        status.textContent = `Error: ${error.message}`
        published.checked = !published.checked
        published.disabled = false
      })
  }
  publishedWrap.append(published, 'Published')

  const wholeImageWrap = document.createElement('label')
  wholeImageWrap.className = 'product-published'
  wholeImageWrap.title = 'Show the whole photo in the store, with empty space around it, instead of cropping it to a square. For book covers and other photos where nothing may be cut off.'
  const wholeImage = document.createElement('input')
  wholeImage.type = 'checkbox'
  wholeImage.checked = product.wholeImage
  wholeImage.onchange = () => {
    wholeImage.disabled = true
    status.textContent = 'Saving…'
    saveWholeImage(product.slug, wholeImage.checked)
      .then(() => render())
      .catch((error) => {
        status.textContent = `Error: ${error.message}`
        wholeImage.checked = !wholeImage.checked
        wholeImage.disabled = false
      })
  }
  wholeImageWrap.append(wholeImage, 'Whole image')

  const priceWrap = document.createElement('label')
  priceWrap.className = 'product-price'
  priceWrap.title = 'Price including VAT, in whole kronor'
  const price = document.createElement('input')
  price.type = 'number'
  price.min = '1'
  price.step = '1'
  price.value = String(product.priceOre / 100)
  price.onkeydown = (event) => { if (event.key === 'Enter') price.blur() }
  price.onchange = () => {
    price.disabled = true
    status.textContent = 'Saving price…'
    savePrice(product.slug, Number(price.value))
      .then(() => render())
      .catch((error) => {
        status.textContent = `Error: ${error.message}`
        price.disabled = false
      })
  }
  priceWrap.append(price, 'kr')

  const category = document.createElement('select')
  category.className = 'product-category'
  category.title = 'Category'
  fillCategorySelect(category)
  category.value = product.category ?? ''
  category.onchange = () => {
    category.disabled = true
    status.textContent = 'Saving category…'
    saveCategory(product.slug, category.value)
      .then(() => render())
      .catch((error) => {
        status.textContent = `Error: ${error.message}`
        category.disabled = false
      })
  }

  const vat = document.createElement('select')
  vat.className = 'product-vat'
  vat.title = 'VAT rate'
  appendVatOptions(vat)
  vat.value = String(product.vatRate)
  vat.onchange = () => {
    vat.disabled = true
    status.textContent = 'Saving VAT rate…'
    saveVatRate(product.slug, Number(vat.value))
      .then(() => render())
      .catch((error) => {
        status.textContent = `Error: ${error.message}`
        vat.disabled = false
      })
  }

  const input = document.createElement('input')
  input.type = 'file'
  input.multiple = true
  input.accept = 'image/jpeg,image/png'

  const editCopy = document.createElement('button')
  editCopy.textContent = 'Edit copy'
  editCopy.onclick = () => openCopyDialog(product)

  const variants = document.createElement('button')
  variants.textContent = 'Variants'
  variants.onclick = () => openVariantsDialog(product)

  const photos = document.createElement('button')
  photos.textContent = 'Photos'
  photos.disabled = product.imageCount === 0
  photos.onclick = () => {
    openPhotosDialog(product).catch((error) => { status.textContent = `Error: ${error.message}` })
  }

  const button = document.createElement('button')
  button.textContent = 'Add photos'
  button.onclick = () => input.click()

  input.onchange = () => {
    if (input.files.length === 0) return
    // The file picker's order isn't reliable (Firefox on Linux returns picks in
    // arbitrary order), so upload by filename: IMG_0012 before IMG_0103.
    const files = Array.from(input.files)
      .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }))
    button.disabled = true
    uploadFiles(product.slug, files, status)
      .catch((error) => { status.textContent = `Error: ${error.message}` })
      .finally(() => { button.disabled = false; input.value = '' })
  }

  row.append(publishedWrap, name, priceWrap, category, vat, count, wholeImageWrap, variantCount, status, editCopy, variants, photos, button, input)
  return row
}

// Null while the shared dialog is creating a new category.
let categoryDialogEntry = null

function openCategoryDialog(category) {
  const form = document.getElementById('category-form')
  categoryDialogEntry = category
  document.getElementById('category-title').textContent = category ? `Edit category: ${category.name.sv}` : 'New category'
  document.getElementById('category-status').textContent = ''
  form.elements['name-sv'].value = category?.name.sv ?? ''
  form.elements['name-en'].value = category?.name.en ?? ''
  document.getElementById('category-dialog').showModal()
}

function setupCategoryDialog() {
  const dialog = document.getElementById('category-dialog')
  const form = document.getElementById('category-form')
  const status = document.getElementById('category-status')
  const save = document.getElementById('category-save')

  document.getElementById('new-category-button').onclick = () => openCategoryDialog(null)
  document.getElementById('category-cancel').onclick = () => dialog.close()

  form.onsubmit = (event) => {
    event.preventDefault()
    const name = { sv: form.elements['name-sv'].value, en: form.elements['name-en'].value }
    let saved
    if (categoryDialogEntry) {
      saved = sendCategoryRequest('PUT', `/${encodeURIComponent(categoryDialogEntry.id)}`, { name })
    } else {
      const entry = { name }
      assignVariantIds([...categories, entry], 'kategori')
      saved = sendCategoryRequest('POST', '', entry)
    }
    save.disabled = true
    status.textContent = ''
    saved
      .then(() => { dialog.close(); return render() })
      .catch((error) => { status.textContent = `Error: ${error.message}` })
      .finally(() => { save.disabled = false })
  }
}

function renderCategoryRow(category, position, productCount) {
  const row = document.createElement('div')
  row.className = 'category-row'

  const sv = document.createElement('span')
  sv.textContent = category.name.sv
  const en = document.createElement('span')
  en.textContent = category.name.en
  const count = document.createElement('span')
  count.className = 'product-count'
  count.textContent = `${productCount} product${productCount === 1 ? '' : 's'}`
  const status = document.createElement('span')
  status.className = 'product-status'

  const showError = (error) => { status.textContent = `Error: ${error.message}` }

  const move = (to) => {
    const order = categories.map((entry) => entry.id)
    order.splice(to, 0, order.splice(position, 1)[0])
    sendCategoryRequest('POST', '/reorder', { order }).then(render).catch(showError)
  }

  const remove = variantButton('Delete', 'Delete this category', () => {
    const warning = productCount > 0 ? ` ${productCount} product${productCount === 1 ? '' : 's'} will become uncategorized.` : ''
    if (!confirm(`Delete ${category.name.sv}?${warning}`)) return
    sendCategoryRequest('DELETE', `/${encodeURIComponent(category.id)}`).then(render).catch(showError)
  })
  remove.classList.add('variant-delete')

  row.append(
    sv,
    en,
    count,
    status,
    variantButton('↑', 'Move up (sets the order of the store buttons)', () => move(position - 1), position === 0),
    variantButton('↓', 'Move down (sets the order of the store buttons)', () => move(position + 1), position === categories.length - 1),
    variantButton('Edit', 'Edit the names of this category', () => openCategoryDialog(category)),
    remove,
  )
  return row
}

function renderCategoriesTab(products) {
  const list = document.getElementById('category-list')
  if (categories.length === 0) {
    const empty = document.createElement('p')
    empty.className = 'photo-empty'
    empty.textContent = 'No categories yet.'
    list.replaceChildren(empty)
    return
  }

  const header = document.createElement('div')
  header.className = 'category-row category-header'
  for (const text of ['Svenska', 'English']) {
    const column = document.createElement('span')
    column.textContent = text
    header.appendChild(column)
  }

  list.replaceChildren(
    header,
    ...categories.map((category, position) =>
      renderCategoryRow(category, position, products.filter((product) => product.category === category.id).length),
    ),
  )
}

function showTab(tab) {
  for (const button of document.querySelectorAll('.page-tabs button')) {
    button.setAttribute('aria-selected', String(button.dataset.tab === tab))
  }
  document.getElementById('products-tab').hidden = tab !== 'products'
  document.getElementById('categories-tab').hidden = tab !== 'categories'
}

// The tab is kept in the URL so a reload stays on it.
function setupTabs() {
  for (const button of document.querySelectorAll('.page-tabs button')) {
    button.onclick = () => {
      showTab(button.dataset.tab)
      history.replaceState(null, '', `#${button.dataset.tab}`)
    }
  }
  showTab(location.hash === '#categories' ? 'categories' : 'products')
}

function setCommitStatus(text, isError = false) {
  const status = document.getElementById('commit-status')
  status.textContent = text
  status.classList.toggle('error', isError)
}

// Keeps the last commit's result on screen until the next change shows up.
let lastCommitNote = null

async function refreshCommitBar() {
  const button = document.getElementById('commit-button')
  const status = document.getElementById('commit-status')
  try {
    const res = await fetch('/api/changes')
    if (!res.ok) throw new Error(`Status ${res.status}`)
    const { files } = await res.json()
    button.disabled = files.length === 0
    status.title = files.join('\n')
    if (files.length > 0) {
      lastCommitNote = null
      setCommitStatus(`${files.length} changed file${files.length === 1 ? '' : 's'}`)
    } else {
      setCommitStatus(lastCommitNote ?? 'No changes to commit')
    }
  } catch (error) {
    button.disabled = true
    setCommitStatus(`Couldn't check for changes: ${error.message}`, true)
  }
}

function openCommitDialog(files) {
  document.getElementById('commit-title').textContent =
    `Commit ${files.length} file${files.length === 1 ? '' : 's'}?`
  document.getElementById('commit-files').replaceChildren(...files.map((file) => {
    const item = document.createElement('li')
    item.textContent = file
    return item
  }))
  document.getElementById('commit-dialog').showModal()
}

function setupCommitBar() {
  const button = document.getElementById('commit-button')
  const message = document.getElementById('commit-message')
  const dialog = document.getElementById('commit-dialog')
  document.getElementById('commit-cancel').onclick = () => dialog.close()

  // Asks the server rather than reusing the commit bar's last check, so the
  // list matches what's on disk at the moment of committing.
  button.onclick = async () => {
    button.disabled = true
    try {
      const res = await fetch('/api/changes')
      if (!res.ok) throw new Error(`Status ${res.status}`)
      const { files } = await res.json()
      if (files.length === 0) return refreshCommitBar()
      openCommitDialog(files)
      button.disabled = false
    } catch (error) {
      button.disabled = false
      setCommitStatus(`Couldn't check for changes: ${error.message}`, true)
    }
  }

  // No preventDefault: method="dialog" closes the popup on submit.
  document.getElementById('commit-form').onsubmit = async () => {
    button.disabled = true
    setCommitStatus('Committing…')
    try {
      const res = await fetch('/api/commit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: message.value }),
      })
      const body = await res.json().catch(() => ({}))
      if (!res.ok) throw new Error(body.error ?? `Commit failed (${res.status})`)
      message.value = ''
      lastCommitNote = `Committed ${body.hash}, not pushed yet`
      await refreshCommitBar()
    } catch (error) {
      button.disabled = false
      setCommitStatus(`Error: ${error.message}`, true)
    }
  }
  // Picks up commits or edits made outside the CMS.
  window.addEventListener('focus', refreshCommitBar)
}

async function render() {
  refreshCommitBar()
  const app = document.getElementById('app')
  const [products, loadedCategories] = await Promise.all([loadProducts(), loadCategories()])
  categories = loadedCategories
  const groups = groupByCategory(products)
  app.innerHTML = ''
  renderCategoriesTab(products)

  for (const [category, items] of groups) {
    const heading = document.createElement('h2')
    heading.textContent = category
    app.appendChild(heading)
    for (const product of items) {
      app.appendChild(renderProductRow(product))
    }
  }
}

setupNewProductDialog()
setupCopyDialog()
setupVariantsDialog()
setupPhotosDialog()
setupCategoryDialog()
setupTabs()
setupCommitBar()
render().catch((error) => {
  document.getElementById('app').textContent = `Failed to load products: ${error.message}`
})
</script>

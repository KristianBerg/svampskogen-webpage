<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Svampskogen CMS</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 1240px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.3rem; }
  h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: 0.05em; color: #666; margin-top: 2rem; }
  /* Fixed columns so the controls line up across rows whatever the name or
     status length; long text wraps inside its own column. */
  .product { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr) 6.5rem 9rem 7.5rem 5rem 10rem auto auto auto; align-items: center; gap: 0.75rem; padding: 0.5rem 0; border-bottom: 1px solid #eee; }
  .product-name { overflow-wrap: anywhere; }
  .product-published { display: flex; align-items: center; gap: 0.3rem; font-size: 0.8rem; color: #666; cursor: pointer; }
  .product.unpublished .product-name { color: #999; font-style: italic; }
  .product-count { color: #888; font-size: 0.85rem; }
  .product-status { font-size: 0.85rem; color: #888; overflow-wrap: anywhere; }
  .product-category { font: inherit; font-size: 0.85rem; width: 100%; box-sizing: border-box; padding: 0.2rem 0.4rem; }
  .product-price { display: flex; align-items: center; gap: 0.3rem; font-size: 0.85rem; color: #666; }
  .product-price input { font: inherit; width: 100%; min-width: 0; box-sizing: border-box; padding: 0.2rem 0.4rem; }
  .product-vat { font: inherit; font-size: 0.85rem; width: 100%; padding: 0.2rem 0.4rem; }
  button { font: inherit; padding: 0.3rem 0.75rem; cursor: pointer; }
  input[type="file"] { display: none; }
  dialog { width: min(640px, calc(100vw - 2rem)); border: 1px solid #ccc; border-radius: 6px; padding: 1.25rem; }
  dialog::backdrop { background: rgba(0, 0, 0, 0.35); }
  dialog h3 { margin: 0 0 1rem; font-size: 1.1rem; }
  dialog fieldset { border: 1px solid #ddd; border-radius: 4px; margin: 0 0 1rem; padding: 0.75rem; }
  dialog legend { font-weight: 600; font-size: 0.9rem; }
  dialog label { display: block; font-size: 0.85rem; color: #555; margin-bottom: 0.75rem; }
  dialog input, dialog textarea { display: block; box-sizing: border-box; width: 100%; margin-top: 0.25rem; font: inherit; padding: 0.35rem 0.5rem; }
  dialog textarea { min-height: 7rem; resize: vertical; }
  .dialog-actions { display: flex; align-items: center; justify-content: flex-end; gap: 0.5rem; }
  .dialog-status { flex: 1; font-size: 0.85rem; color: #b00; }
  .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 0.75rem; margin-bottom: 1rem; }
  .photo { border: 1px solid #ddd; border-radius: 4px; padding: 0.4rem; background: #fff; cursor: grab; }
  .photo.dragging { opacity: 0.4; }
  .photo img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: #f3f3f3; pointer-events: none; }
  .photo-meta { font-size: 0.8rem; color: #666; margin: 0.3rem 0; }
  .photo-actions { display: flex; gap: 0.25rem; }
  .photo-actions button { padding: 0.15rem 0.4rem; font-size: 0.8rem; }
  .photo-actions .photo-delete { margin-left: auto; color: #b00; }
  .photo-empty { color: #888; font-size: 0.9rem; }
  .commit-bar { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; border: 1px solid #ddd; border-radius: 4px; background: #fafafa; }
  .commit-message { flex: 1; min-width: 0; font: inherit; font-size: 0.85rem; padding: 0.25rem 0.5rem; }
  .commit-status { font-size: 0.85rem; color: #666; overflow-wrap: anywhere; }
  .commit-status.error { color: #b00; }
  .commit-files { margin: 0 0 1rem; padding: 0.5rem 0.75rem; max-height: 50vh; overflow-y: auto; list-style: none; border: 1px solid #ddd; border-radius: 4px; font-family: monospace; font-size: 0.8rem; overflow-wrap: anywhere; }
  .page-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  dialog select { display: block; width: 100%; margin-top: 0.25rem; font: inherit; padding: 0.35rem 0.5rem; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem; }
  .field-hint { display: block; font-size: 0.8rem; color: #888; margin-top: 0.2rem; }
</style>
</head>
<body>
<div class="page-header">
  <h1>Svampskogen CMS</h1>
  <button type="button" id="new-product-button">New product</button>
</div>
<div class="commit-bar">
  <span class="commit-status" id="commit-status"></span>
  <input class="commit-message" id="commit-message" placeholder="Commit message (optional)" />
  <button type="button" id="commit-button" disabled>Commit changes</button>
</div>
<div id="app">Loading products…</div>
<datalist id="category-options"></datalist>

<dialog id="copy-dialog">
  <form id="copy-form" method="dialog">
    <h3 id="copy-title">Edit copy</h3>
    <fieldset>
      <legend>Svenska</legend>
      <label>Name <input name="name-sv" required maxlength="120" /></label>
      <label>Description <textarea name="description-sv"></textarea></label>
    </fieldset>
    <fieldset>
      <legend>English</legend>
      <label>Name <input name="name-en" required maxlength="120" /></label>
      <label>Description <textarea name="description-en"></textarea></label>
    </fieldset>
    <div class="dialog-actions">
      <span class="dialog-status" id="copy-status"></span>
      <button type="button" id="copy-cancel">Cancel</button>
      <button type="submit" id="copy-save">Save</button>
    </div>
  </form>
</dialog>

<dialog id="new-product-dialog">
  <form id="new-product-form" method="dialog">
    <h3>New product</h3>
    <fieldset>
      <legend>Name</legend>
      <label>Svenska <input name="name-sv" required maxlength="120" /></label>
      <label>English <input name="name-en" required maxlength="120" /></label>
      <label>Slug
        <input name="slug" required maxlength="60" pattern="[a-z0-9]+(-[a-z0-9]+)*" />
        <span class="field-hint">Used in the product URL and photo folders, can't be changed later in the CMS</span>
      </label>
    </fieldset>
    <div class="field-row">
      <label>Price (kr) <input name="price" type="number" required min="1" max="99999" step="1" /></label>
      <label>VAT <select name="vat"></select></label>
      <label>Category <input name="category" list="category-options" maxlength="60" /></label>
    </div>
    <div class="dialog-actions">
      <span class="dialog-status" id="new-product-status"></span>
      <button type="button" id="new-product-cancel">Cancel</button>
      <button type="submit" id="new-product-save">Create unpublished</button>
    </div>
  </form>
</dialog>

<dialog id="photos-dialog">
  <form id="photos-form" method="dialog">
    <h3 id="photos-title">Photos</h3>
    <div class="photo-grid" id="photo-grid"></div>
    <div class="dialog-actions">
      <span class="dialog-status" id="photos-status"></span>
      <button type="button" id="photos-cancel">Cancel</button>
      <button type="submit" id="photos-save">Save</button>
    </div>
  </form>
</dialog>

<dialog id="commit-dialog">
  <form id="commit-form" method="dialog">
    <h3 id="commit-title">Commit</h3>
    <ul class="commit-files" id="commit-files"></ul>
    <div class="dialog-actions">
      <button type="button" id="commit-cancel">Cancel</button>
      <button type="submit" id="commit-confirm">Commit</button>
    </div>
  </form>
</dialog>

<script>
async function loadProducts() {
  const res = await fetch('/api/products')
  return res.json()
}

function groupByCategory(products) {
  const groups = new Map()
  for (const product of products) {
    const key = product.category ?? 'Uncategorized'
    if (!groups.has(key)) groups.set(key, [])
    groups.get(key).push(product)
  }
  return groups
}

async function savePublished(slug, published) {
  const res = await fetch(`/api/products/${encodeURIComponent(slug)}/published`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ published }),
  })
  if (!res.ok) {
    const body = await res.json().catch(() => ({}))
    throw new Error(body.error ?? `Saving published state failed (${res.status})`)
  }
}

async function savePrice(slug, priceKr) {
  const res = await fetch(`/api/products/${encodeURIComponent(slug)}/price`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ priceKr }),
  })
  if (!res.ok) {
    const body = await res.json().catch(() => ({}))
    throw new Error(body.error ?? `Saving price failed (${res.status})`)
  }
}

async function saveCategory(slug, category) {
  const res = await fetch(`/api/products/${encodeURIComponent(slug)}/category`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ category }),
  })
  if (!res.ok) {
    const body = await res.json().catch(() => ({}))
    throw new Error(body.error ?? `Saving category failed (${res.status})`)
  }
}

async function saveVatRate(slug, vatRate) {
  const res = await fetch(`/api/products/${encodeURIComponent(slug)}/vat-rate`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ vatRate }),
  })
  if (!res.ok) {
    const body = await res.json().catch(() => ({}))
    throw new Error(body.error ?? `Saving VAT rate failed (${res.status})`)
  }
}

async function saveCopy(slug, copy) {
  const res = await fetch(`/api/products/${encodeURIComponent(slug)}/copy`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(copy),
  })
  if (!res.ok) {
    const body = await res.json().catch(() => ({}))
    throw new Error(body.error ?? `Saving copy failed (${res.status})`)
  }
}

const VAT_RATES = [0.25, 0.12, 0.06]

function appendVatOptions(select) {
  for (const rate of VAT_RATES) {
    const option = document.createElement('option')
    option.value = String(rate)
    option.textContent = `${Math.round(rate * 100)}% moms`
    select.appendChild(option)
  }
}

async function createProduct(product) {
  const res = await fetch('/api/products', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(product),
  })
  if (!res.ok) {
    const body = await res.json().catch(() => ({}))
    throw new Error(body.error ?? `Creating product failed (${res.status})`)
  }
}

// "Svampkniv Ek & Läder" -> "svampkniv-ek-lader". Diacritics are stripped
// (å/ä -> a, ö -> o) since the slug ends up in URLs and folder names.
function slugify(text) {
  return text
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 60)
    .replace(/-+$/, '')
}

function setupNewProductDialog() {
  const dialog = document.getElementById('new-product-dialog')
  const form = document.getElementById('new-product-form')
  const status = document.getElementById('new-product-status')
  const save = document.getElementById('new-product-save')
  const { slug, vat } = form.elements
  appendVatOptions(vat)

  // The slug follows the Swedish name until it's edited by hand.
  let slugEdited = false
  form.elements['name-sv'].oninput = () => {
    if (!slugEdited) slug.value = slugify(form.elements['name-sv'].value)
  }
  slug.oninput = () => { slugEdited = slug.value !== '' }

  document.getElementById('new-product-button').onclick = () => {
    form.reset()
    vat.value = '0.25'
    slugEdited = false
    status.textContent = ''
    dialog.showModal()
  }
  document.getElementById('new-product-cancel').onclick = () => dialog.close()

  form.onsubmit = (event) => {
    event.preventDefault()
    const product = {
      slug: slug.value,
      priceKr: Number(form.elements.price.value),
      vatRate: Number(vat.value),
      category: form.elements.category.value,
      name: { sv: form.elements['name-sv'].value, en: form.elements['name-en'].value },
    }
    save.disabled = true
    status.textContent = ''
    createProduct(product)
      .then(() => { dialog.close(); return render() })
      .catch((error) => { status.textContent = `Error: ${error.message}` })
      .finally(() => { save.disabled = false })
  }
}

// One shared dialog; openCopyDialog points it at whichever product's
// "Edit copy" button was clicked.
let copyDialogSlug = null

function openCopyDialog(product) {
  const dialog = document.getElementById('copy-dialog')
  const form = document.getElementById('copy-form')
  copyDialogSlug = product.slug
  document.getElementById('copy-title').textContent = `Edit copy: ${product.name}`
  document.getElementById('copy-status').textContent = ''
  form.elements['name-sv'].value = product.copy.name.sv
  form.elements['name-en'].value = product.copy.name.en
  form.elements['description-sv'].value = product.copy.description.sv
  form.elements['description-en'].value = product.copy.description.en
  dialog.showModal()
}

function setupCopyDialog() {
  const dialog = document.getElementById('copy-dialog')
  const form = document.getElementById('copy-form')
  const status = document.getElementById('copy-status')
  const save = document.getElementById('copy-save')

  document.getElementById('copy-cancel').onclick = () => dialog.close()

  form.onsubmit = (event) => {
    event.preventDefault()
    const copy = {
      name: { sv: form.elements['name-sv'].value, en: form.elements['name-en'].value },
      description: { sv: form.elements['description-sv'].value, en: form.elements['description-en'].value },
    }
    save.disabled = true
    status.textContent = ''
    saveCopy(copyDialogSlug, copy)
      .then(() => { dialog.close(); return render() })
      .catch((error) => { status.textContent = `Error: ${error.message}` })
      .finally(() => { save.disabled = false })
  }
}

async function loadPhotos(slug) {
  const res = await fetch(`/api/products/${encodeURIComponent(slug)}/photos`)
  if (!res.ok) throw new Error(`Loading photos failed (${res.status})`)
  return res.json()
}

async function savePhotoOrder(slug, order) {
  const res = await fetch(`/api/products/${encodeURIComponent(slug)}/photos`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ order }),
  })
  if (!res.ok) {
    const body = await res.json().catch(() => ({}))
    throw new Error(body.error ?? `Saving photos failed (${res.status})`)
  }
}

async function runProcess() {
  const res = await fetch('/api/process', { method: 'POST' })
  const body = await res.json()
  if (!res.ok) throw new Error(`Processing failed: ${body.output ?? res.status}`)
}

// Like the copy dialog, one shared dialog. photosDialogOrder holds the
// photos' original numbers in their pending order; it's only sent to the
// server on Save.
let photosDialogSlug = null
let photosDialogOrder = []
let photosDialogTotal = 0

async function openPhotosDialog(product) {
  const dialog = document.getElementById('photos-dialog')
  photosDialogSlug = product.slug
  document.getElementById('photos-title').textContent = `Photos: ${product.name}`
  document.getElementById('photos-status').textContent = ''
  const photos = await loadPhotos(product.slug)
  photosDialogOrder = photos.map((photo) => photo.n)
  photosDialogTotal = photos.length
  renderPhotoGrid()
  dialog.showModal()
}

function movePhoto(from, to) {
  if (to < 0 || to >= photosDialogOrder.length) return
  const [n] = photosDialogOrder.splice(from, 1)
  photosDialogOrder.splice(to, 0, n)
  renderPhotoGrid()
}

function renderPhotoGrid() {
  const grid = document.getElementById('photo-grid')
  grid.innerHTML = ''
  if (photosDialogOrder.length === 0) {
    const empty = document.createElement('p')
    empty.className = 'photo-empty'
    empty.textContent = 'No photos left. Saving will remove them all.'
    grid.appendChild(empty)
    return
  }

  // Changes on every open, so a thumbnail renamed by an earlier save isn't
  // served from the browser cache under its old number.
  const cacheKey = Date.now()

  for (const [position, n] of photosDialogOrder.entries()) {
    const card = document.createElement('div')
    card.className = 'photo'
    card.draggable = true
    card.ondragstart = (event) => {
      event.dataTransfer.setData('text/plain', String(position))
      card.classList.add('dragging')
    }
    card.ondragend = () => card.classList.remove('dragging')
    card.ondragover = (event) => event.preventDefault()
    card.ondrop = (event) => {
      event.preventDefault()
      movePhoto(Number(event.dataTransfer.getData('text/plain')), position)
    }

    const img = document.createElement('img')
    img.src = `/api/products/${encodeURIComponent(photosDialogSlug)}/photos/${n}/thumb?v=${cacheKey}`
    img.alt = `Photo ${n}`

    const meta = document.createElement('div')
    meta.className = 'photo-meta'
    meta.textContent = position === 0 ? `${position + 1} (main)` : String(position + 1)

    const actions = document.createElement('div')
    actions.className = 'photo-actions'

    const left = document.createElement('button')
    left.type = 'button'
    left.textContent = '←'
    left.title = 'Move earlier'
    left.disabled = position === 0
    left.onclick = () => movePhoto(position, position - 1)

    const right = document.createElement('button')
    right.type = 'button'
    right.textContent = '→'
    right.title = 'Move later'
    right.disabled = position === photosDialogOrder.length - 1
    right.onclick = () => movePhoto(position, position + 1)

    const remove = document.createElement('button')
    remove.type = 'button'
    remove.className = 'photo-delete'
    remove.textContent = 'Delete'
    remove.onclick = () => {
      photosDialogOrder.splice(position, 1)
      renderPhotoGrid()
    }

    actions.append(left, right, remove)
    card.append(img, meta, actions)
    grid.appendChild(card)
  }
}

function setupPhotosDialog() {
  const dialog = document.getElementById('photos-dialog')
  const form = document.getElementById('photos-form')
  const status = document.getElementById('photos-status')
  const save = document.getElementById('photos-save')

  document.getElementById('photos-cancel').onclick = () => dialog.close()

  form.onsubmit = (event) => {
    event.preventDefault()
    const deleted = photosDialogTotal - photosDialogOrder.length
    if (deleted > 0 && !confirm(`Delete ${deleted} photo${deleted === 1 ? '' : 's'}?`)) return
    save.disabled = true
    status.textContent = 'Saving…'
    savePhotoOrder(photosDialogSlug, photosDialogOrder)
      .then(() => { status.textContent = 'Processing…'; return runProcess() })
      .then(() => { dialog.close(); return render() })
      .catch((error) => { status.textContent = `Error: ${error.message}` })
      .finally(() => { save.disabled = false })
  }
}

async function uploadFiles(slug, files, statusEl) {
  for (let i = 0; i < files.length; i++) {
    statusEl.textContent = `Uploading ${i + 1}/${files.length}…`
    const res = await fetch(`/api/products/${encodeURIComponent(slug)}/upload`, {
      method: 'POST',
      headers: { 'X-Filename': files[i].name },
      body: files[i],
    })
    if (!res.ok) {
      const body = await res.json().catch(() => ({}))
      throw new Error(body.error ?? `Upload failed (${res.status})`)
    }
  }

  statusEl.textContent = 'Processing…'
  await runProcess()
  refreshCommitBar()

  statusEl.textContent = `Done — uploaded ${files.length} photo(s).`
}

function renderProductRow(product) {
  const row = document.createElement('div')
  row.className = product.published ? 'product' : 'product unpublished'

  const name = document.createElement('span')
  name.className = 'product-name'
  name.textContent = product.name

  const count = document.createElement('span')
  count.className = 'product-count'
  count.textContent = `${product.imageCount} photo${product.imageCount === 1 ? '' : 's'}`

  const status = document.createElement('span')
  status.className = 'product-status'

  const publishedWrap = document.createElement('label')
  publishedWrap.className = 'product-published'
  publishedWrap.title = 'Unpublished products stay here but are hidden from the store and cannot be bought'
  const published = document.createElement('input')
  published.type = 'checkbox'
  published.checked = product.published
  published.onchange = () => {
    published.disabled = true
    status.textContent = 'Saving…'
    savePublished(product.slug, published.checked)
      .then(() => render())
      .catch((error) => {
        status.textContent = `Error: ${error.message}`
        published.checked = !published.checked
        published.disabled = false
      })
  }
  publishedWrap.append(published, 'Published')

  const priceWrap = document.createElement('label')
  priceWrap.className = 'product-price'
  priceWrap.title = 'Price including VAT, in whole kronor'
  const price = document.createElement('input')
  price.type = 'number'
  price.min = '1'
  price.step = '1'
  price.value = String(product.priceOre / 100)
  price.onkeydown = (event) => { if (event.key === 'Enter') price.blur() }
  price.onchange = () => {
    price.disabled = true
    status.textContent = 'Saving price…'
    savePrice(product.slug, Number(price.value))
      .then(() => render())
      .catch((error) => {
        status.textContent = `Error: ${error.message}`
        price.disabled = false
      })
  }
  priceWrap.append(price, 'kr')

  const category = document.createElement('input')
  category.className = 'product-category'
  category.placeholder = 'Category'
  category.value = product.category ?? ''
  category.setAttribute('list', 'category-options')
  category.onkeydown = (event) => { if (event.key === 'Enter') category.blur() }
  category.onchange = () => {
    category.disabled = true
    status.textContent = 'Saving category…'
    saveCategory(product.slug, category.value)
      .then(() => render())
      .catch((error) => {
        status.textContent = `Error: ${error.message}`
        category.disabled = false
      })
  }

  const vat = document.createElement('select')
  vat.className = 'product-vat'
  vat.title = 'VAT rate'
  appendVatOptions(vat)
  vat.value = String(product.vatRate)
  vat.onchange = () => {
    vat.disabled = true
    status.textContent = 'Saving VAT rate…'
    saveVatRate(product.slug, Number(vat.value))
      .then(() => render())
      .catch((error) => {
        status.textContent = `Error: ${error.message}`
        vat.disabled = false
      })
  }

  const input = document.createElement('input')
  input.type = 'file'
  input.multiple = true
  input.accept = 'image/jpeg,image/png'

  const editCopy = document.createElement('button')
  editCopy.textContent = 'Edit copy'
  editCopy.onclick = () => openCopyDialog(product)

  const photos = document.createElement('button')
  photos.textContent = 'Photos'
  photos.disabled = product.imageCount === 0
  photos.onclick = () => {
    openPhotosDialog(product).catch((error) => { status.textContent = `Error: ${error.message}` })
  }

  const button = document.createElement('button')
  button.textContent = 'Add photos'
  button.onclick = () => input.click()

  input.onchange = () => {
    if (input.files.length === 0) return
    // The file picker's order isn't reliable (Firefox on Linux returns picks in
    // arbitrary order), so upload by filename: IMG_0012 before IMG_0103.
    const files = Array.from(input.files)
      .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }))
    button.disabled = true
    uploadFiles(product.slug, files, status)
      .catch((error) => { status.textContent = `Error: ${error.message}` })
      .finally(() => { button.disabled = false; input.value = '' })
  }

  row.append(publishedWrap, name, priceWrap, category, vat, count, status, editCopy, photos, button, input)
  return row
}

function setCommitStatus(text, isError = false) {
  const status = document.getElementById('commit-status')
  status.textContent = text
  status.classList.toggle('error', isError)
}

// Keeps the last commit's result on screen until the next change shows up.
let lastCommitNote = null

async function refreshCommitBar() {
  const button = document.getElementById('commit-button')
  const status = document.getElementById('commit-status')
  try {
    const res = await fetch('/api/changes')
    if (!res.ok) throw new Error(`Status ${res.status}`)
    const { files } = await res.json()
    button.disabled = files.length === 0
    status.title = files.join('\n')
    if (files.length > 0) {
      lastCommitNote = null
      setCommitStatus(`${files.length} changed file${files.length === 1 ? '' : 's'}`)
    } else {
      setCommitStatus(lastCommitNote ?? 'No changes to commit')
    }
  } catch (error) {
    button.disabled = true
    setCommitStatus(`Couldn't check for changes: ${error.message}`, true)
  }
}

function openCommitDialog(files) {
  document.getElementById('commit-title').textContent =
    `Commit ${files.length} file${files.length === 1 ? '' : 's'}?`
  document.getElementById('commit-files').replaceChildren(...files.map((file) => {
    const item = document.createElement('li')
    item.textContent = file
    return item
  }))
  document.getElementById('commit-dialog').showModal()
}

function setupCommitBar() {
  const button = document.getElementById('commit-button')
  const message = document.getElementById('commit-message')
  const dialog = document.getElementById('commit-dialog')
  document.getElementById('commit-cancel').onclick = () => dialog.close()

  // Asks the server rather than reusing the commit bar's last check, so the
  // list matches what's on disk at the moment of committing.
  button.onclick = async () => {
    button.disabled = true
    try {
      const res = await fetch('/api/changes')
      if (!res.ok) throw new Error(`Status ${res.status}`)
      const { files } = await res.json()
      if (files.length === 0) return refreshCommitBar()
      openCommitDialog(files)
      button.disabled = false
    } catch (error) {
      button.disabled = false
      setCommitStatus(`Couldn't check for changes: ${error.message}`, true)
    }
  }

  // No preventDefault: method="dialog" closes the popup on submit.
  document.getElementById('commit-form').onsubmit = async () => {
    button.disabled = true
    setCommitStatus('Committing…')
    try {
      const res = await fetch('/api/commit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: message.value }),
      })
      const body = await res.json().catch(() => ({}))
      if (!res.ok) throw new Error(body.error ?? `Commit failed (${res.status})`)
      message.value = ''
      lastCommitNote = `Committed ${body.hash}, not pushed yet`
      await refreshCommitBar()
    } catch (error) {
      button.disabled = false
      setCommitStatus(`Error: ${error.message}`, true)
    }
  }
  // Picks up commits or edits made outside the CMS.
  window.addEventListener('focus', refreshCommitBar)
}

async function render() {
  refreshCommitBar()
  const app = document.getElementById('app')
  const products = await loadProducts()
  const groups = groupByCategory(products)
  app.innerHTML = ''

  const datalist = document.getElementById('category-options')
  datalist.innerHTML = ''
  for (const category of new Set(products.map((p) => p.category).filter(Boolean))) {
    const option = document.createElement('option')
    option.value = category
    datalist.appendChild(option)
  }

  for (const [category, items] of groups) {
    const heading = document.createElement('h2')
    heading.textContent = category
    app.appendChild(heading)
    for (const product of items) {
      app.appendChild(renderProductRow(product))
    }
  }
}

setupNewProductDialog()
setupCopyDialog()
setupPhotosDialog()
setupCommitBar()
render().catch((error) => {
  document.getElementById('app').textContent = `Failed to load products: ${error.message}`
})
</script>
</body>
